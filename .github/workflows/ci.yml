name: Simple Suppers CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type checking
        run: npm run typecheck

      - name: Run tests
        run: npm test
        if: ${{ hashFiles('jest.config.js') != '' }}

      - name: Build Next.js application
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build-${{ github.sha }}
          path: |
            .next/
            out/
          retention-days: 1
        if: success()

      - name: Trigger Netlify Deploy
        if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        run: curl -X POST -d {} ${{ secrets.NETLIFY_BUILD_HOOK_URL }}

  # Optional: Code quality checks
  code-quality:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for potential security vulnerabilities
        run: npm audit --audit-level=moderate

      - name: Check for outdated dependencies
        run: npm outdated || true

  # Summary job for branch protection
  ci-status:
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: always()

    steps:
      - name: Check CI status
        run: |
          if [[ "${{ needs.build-and-test.result }}" == "success" ]]; then
            echo "✅ All CI checks passed!"
            exit 0
          else
            echo "❌ CI checks failed"
            exit 1
          fi

  # CD status for deployment tracking
  cd-status:
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - name: Wait for Netlify Deploy
        run: sleep 30 # Give Netlify time to start deployment
        
      - name: Check Netlify Deploy Status
        run: |
          if [[ "${{ needs.build-and-test.result }}" == "success" ]]; then
            for i in {1..10}; do
              status=$(curl -s "${{ secrets.NETLIFY_DEPLOY_STATUS_BADGE }}")
              if [[ $status == *"success"* ]]; then
                echo "✅ Netlify deployment successful!"
                exit 0
              elif [[ $status == *"failed"* ]]; then
                echo "❌ Netlify deployment failed"
                exit 1
              fi
              echo "⏳ Deployment in progress... (attempt $i/10)"
              sleep 30
            done
            echo "⚠️ Deployment status check timed out"
            exit 1
          else
            echo "❌ Deployment skipped - CI checks failed"
            exit 1
          fi