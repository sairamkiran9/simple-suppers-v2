name: Bundle Size Check

on:
  pull_request:
    branches: [main, develop]

jobs:
  bundle-size:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Analyze bundle size
        id: bundle-size
        run: |
          # Get the size of the build output
          BUILD_SIZE=$(du -sb .next | cut -f1)
          echo "build_size=$BUILD_SIZE" >> $GITHUB_OUTPUT

          # Get individual chunk sizes
          if [ -d ".next/static/chunks" ]; then
            echo "## Bundle Analysis" >> bundle-report.md
            echo "" >> bundle-report.md
            echo "### Build Size" >> bundle-report.md
            echo "Total build size: $(numfmt --to=iec $BUILD_SIZE)" >> bundle-report.md
            echo "" >> bundle-report.md
            echo "### Largest Chunks" >> bundle-report.md
            echo "| File | Size |" >> bundle-report.md
            echo "|------|------|" >> bundle-report.md

            find .next/static/chunks -name "*.js" -type f -exec du -b {} + | \
              sort -nr | head -10 | \
              while read size file; do
                filename=$(basename "$file")
                formatted_size=$(numfmt --to=iec "$size")
                echo "| $filename | $formatted_size |" >> bundle-report.md
              done
          fi

      - name: Comment bundle size
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let comment = '## 📦 Bundle Size Report\n\n';

            if (fs.existsSync('bundle-report.md')) {
              const report = fs.readFileSync('bundle-report.md', 'utf8');
              comment += report;
            } else {
              comment += '✅ Bundle analysis completed successfully.\n';
              comment += `Build size: ${(${{ steps.bundle-size.outputs.build_size }} / (1024 * 1024)).toFixed(2)} MB`;
            }

            comment += '\n\n---\n*This report was generated automatically by the bundle-size workflow.*';

            // Check if there's already a comment from this workflow
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find(comment =>
              comment.body.includes('📦 Bundle Size Report')
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }

      - name: Check for size increases
        run: |
          CURRENT_SIZE=${{ steps.bundle-size.outputs.build_size }}
          SIZE_LIMIT=52428800  # 50MB in bytes

          if [ "$CURRENT_SIZE" -gt "$SIZE_LIMIT" ]; then
            echo "❌ Bundle size ($CURRENT_SIZE bytes) exceeds limit ($SIZE_LIMIT bytes)"
            echo "Consider optimizing your bundle or reviewing recent changes."
            exit 1
          else
            echo "✅ Bundle size is within acceptable limits"
          fi