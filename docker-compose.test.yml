version: '3.8'

services:
  # PostgreSQL Test Database
  postgres-test:
    image: postgres:17-alpine
    container_name: simple-suppers-test-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: simple_suppers_test
    ports:
      - "5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - test-network

  # Test Runner
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: simple-suppers-test-runner
    environment:
      - NODE_ENV=test
      - DATABASE_URL=postgresql://postgres:postgres@postgres-test:5432/simple_suppers_test
      - NEXT_PUBLIC_SUPABASE_URL=http://postgres-test:5432
      - NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=test-key
      - SUPABASE_SECRET_KEY=test-secret
      - NEXTAUTH_SECRET=test-nextauth-secret-min-32-chars-long
    depends_on:
      postgres-test:
        condition: service_healthy
    networks:
      - test-network
    volumes:
      - ./coverage:/app/coverage
    command: ["wait-for-db", "postgres-test", "npm", "run", "test:docker"]

networks:
  test-network:
    driver: bridge
